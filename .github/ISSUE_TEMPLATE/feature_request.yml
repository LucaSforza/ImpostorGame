name: Feature idea
description: Suggest an improvement to Pocket Circle
title: "[Idea]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What would you like to do?
      description: Describe the player need or moment this would improve.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What do you have in mind?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you have considered
    validations:
      required: false
